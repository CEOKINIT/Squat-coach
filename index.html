<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KINIT 동작 카운터</title>
<style>
:root{--bg:#0e1512;--fg:#eaf3ef;--mut:#93a69d;--acc:#4cc9a0;--card:#17211d;--line:#2a3833;--warn:#f0a35a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 "Noto Sans KR",system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(12px,env(safe-area-inset-left))}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0}
h1{font-size:17px;margin:0}
.seg{display:flex;gap:6px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px}
button[aria-pressed=true]{background:var(--acc);color:#04251b;border-color:var(--acc);font-weight:700}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.stage{position:relative;flex:1;min-height:0;display:flex;justify-content:center;align-items:center;background:#000;border-radius:12px;overflow:hidden}
.box{position:relative;max-width:100%;max-height:100%}
video,canvas{display:block;max-width:100%;max-height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%}
.mir video,.mir canvas{transform:scaleX(-1)}
.hud{position:absolute;left:12px;top:10px;pointer-events:none}
.hud b{font-size:84px;line-height:1;color:var(--acc);text-shadow:0 2px 8px #000a;font-variant-numeric:tabular-nums}
.hud span{display:block;font-size:13px;color:#fff;text-shadow:0 1px 4px #000}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:800;color:#fff;text-shadow:0 4px 18px #000b;pointer-events:none}
.coach{position:absolute;left:12px;right:12px;bottom:12px;background:#000b;border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px}
.start{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:#0e1512ee;padding:24px;text-align:center}
.start button{background:var(--acc);color:#04251b;font-weight:700;font-size:18px;padding:12px 28px}
.start p{max-width:30em;color:var(--mut);margin:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 0;color:var(--mut);font-size:13px}
.note{color:var(--warn);font-size:12px;padding-bottom:6px}
[hidden]{display:none!important}
</style></head><body>
<header><h1>KINIT 동작 카운터</h1>
<div class="seg" role="group" aria-label="동작"><button id="m1" aria-pressed="true">스쿼트</button><button id="m2" aria-pressed="false">무릎 올리기</button></div></header>
<div class="stage"><div class="box" id="box"><video id="v" playsinline muted></video><canvas id="c"></canvas>
<div class="hud"><b id="n">0</b><span id="st">준비 중</span></div><div class="cd" id="cd" hidden></div><div class="coach" id="coach">아이 전신이 화면에 들어오게 세워 주세요.</div></div>
<div class="start" id="start"><h2 style="margin:0">카메라로 동작 세기</h2>
<p>휴대폰을 고정해 아이 전신이 보이게 세워 주세요. 영상은 기기 밖으로 나가지 않습니다.</p><button id="go">카메라 시작</button><p id="err" style="color:var(--warn)"></p></div></div>
<div class="bar"><label>캐릭터 <select id="sty"><option value="bear" selected>곰인형</option><option value="wood">나무 꼭두각시</option><option value="robot">로봇</option><option value="bone">뼈대</option></select></label><label>목소리 <select id="vox"><option value="teacher" selected>유치원 선생님</option><option value="soldier">씩씩한 군인</option><option value="child">귀여운 어린이</option></select></label><label>기기 음성 <select id="dv"><option value="">자동</option></select></label><label><input type="checkbox" id="coachvox" checked> 자세 코칭 말하기</label><label>수준 <select id="lvl"><option value="5,2,3">쉬움 (5회×2세트)</option><option value="10,3,5" selected>보통 (10회×3세트)</option><option value="15,4,5">힘참 (15회×4세트)</option><option value="inf">슈퍼맨 모드 (무제한)</option><option value="x">직접 설정</option></select></label><label>세트당 <input type="number" id="reps" min="1" max="50" value="10" style="width:3.4em">회</label><label><input type="number" id="sets" min="1" max="10" value="3" style="width:3em">세트</label><label>호흡 <input type="number" id="brt" min="0" max="10" value="5" style="width:3em">번</label><label>배경 <select id="bg"><option value="cam" selected>카메라</option><option value="forest">숲</option><option value="space">우주</option><option value="park">놀이터</option></select></label><label>분석 해상도 <select id="res"><option value="480" selected>정확도 우선</option><option value="320">속도 우선 (사람 추적)</option></select></label><button id="flip">카메라 전환</button><button id="rst">횟수 초기화</button><button id="vtest">음성 테스트</button><button id="snd" aria-pressed="true">소리</button><span id="fps"></span><span id="thr"></span></div>
<div class="note">참고용 시제품입니다. 코칭 문구의 기준은 검증 전입니다.</div>
<script>if("serviceWorker"in navigator&&!self.crossOriginIsolated){navigator.serviceWorker.register("coi-sw.js").then(r=>{if(!navigator.serviceWorker.controller)location.reload()}).catch(()=>{})}</script>
<script src="ort.wasm.min.js"></script><script src="counter.js"></script>
<script>
const $=id=>document.getElementById(id);let S=480;const CHEER_EVERY=10;
let phase='play',mode='squat',facing='user',ctr,stream,sess,running=false,sound=true,actx;
const E=[[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16],[0,5],[0,6]];
const v=$('v'),c=$('c'),g=c.getContext('2d'),w=document.createElement('canvas');let wg,buf;
let setK=1,rtok=0;
const cfg=()=>$('lvl').value==='inf'?{reps:Infinity,sets:1,brt:0,inf:true}:{reps:Math.max(1,+$('reps').value||10),sets:Math.max(1,+$('sets').value||3),brt:Math.max(0,+$('brt').value||0)};
const nTxt=n=>{const r=cfg().reps;return r===Infinity?String(n):n+'/'+r};
function saveCfg(){try{localStorage.setItem('kinit_cfg',JSON.stringify({l:$('lvl').value,r:$('reps').value,s:$('sets').value,b:$('brt').value}))}catch(e){}}
try{const c=JSON.parse(localStorage.getItem('kinit_cfg')||'null');if(c){$('lvl').value=c.l;$('reps').value=c.r;$('sets').value=c.s;$('brt').value=c.b}}catch(e){}
const lvlFx=()=>{$('reps').disabled=$('sets').disabled=$('brt').disabled=$('lvl').value==='inf'};lvlFx();
$('lvl').onchange=()=>{const v=$('lvl').value;$('reps').disabled=$('sets').disabled=$('brt').disabled=v==='inf';if(v!=='x'&&v!=='inf'){const a=v.split(',');$('reps').value=a[0];$('sets').value=a[1];$('brt').value=a[2]}saveCfg();if(phase==='play')$('n').textContent=nTxt(ctr?ctr.count:0)};
['reps','sets','brt'].forEach(i=>$(i).onchange=()=>{$('lvl').value='x';saveCfg();if(phase==='play')$('n').textContent=nTxt(ctr?ctr.count:0)});
const SETV={teacher:{set:k=>k+'세트 끝! 정말 잘했어요!',breath:'코로 들이쉬고~ 입으로 내쉬어요~',next:'자, 다음 세트 시작해요!',fin:'오늘 운동을 모두 끝냈어요! 정말 최고예요!'},
 soldier:{set:k=>k+'세트 완료! 훌륭하다!',breath:'들이쉬고! 내쉬어라!',next:'좋다! 다음 세트 간다!',fin:'오늘 훈련 완료! 너는 최고의 병사다!'},
 child:{set:k=>k+'세트 끝! 잘했지?',breath:'스읍~ 후~',next:'좋아! 다음 세트 하자!',fin:'와! 오늘 운동 다 했다! 나 최고야!'}};
const SV=()=>SETV[$('vox').value];
function breath(i,tok){if(tok!==rtok||phase!=='rest')return;const C=cfg();
 if(i>C.brt){$('cd').hidden=true;vsay('next',SV().next,()=>{if(tok!==rtok)return;setK++;countdown()});return}
 $('cd').hidden=false;$('cd').textContent='호흡 '+i+'/'+C.brt;$('coach').textContent='코로 들이쉬고~ 입으로 내쉬어요';vsay('breath',SV().breath);setTimeout(()=>breath(i+1,tok),4800)}
function setDone(){const C=cfg(),k=setK,fin=k>=C.sets,tok=++rtok;phase=fin?'done':'rest';waiting=false;beep();
 $('coach').textContent='🎉 '+k+'세트 완료!';cheering=true;pend=null;clearTimeout(cheerTimer);
 let moved=false;const next=()=>{if(moved||tok!==rtok)return;moved=true;cheering=false;clearTimeout(cheerTimer);
  if(fin){$('coach').textContent='🏆 오늘 운동 끝! 모두 해냈어요';vsay('fin',SV().fin)}else breath(1,tok)};
 cheerTimer=setTimeout(next,9000);vsay('set'+k,SV().set(k),next)}
let lastAct=0,lostSince=null,waiting=false,lastWait=-99,lastCue=-99,cueN=0,IDLE_SEC=12,LOST_SEC=3;
const WAIT='선생님이 기다리고 있어. 같이 운동하자.',WAIT2='선생님 기다려~',AGAIN='다시 잘 할 수 있지?',BACK='역시 잘할 줄 알았어.';
let waitSt=null,wstage=0,wt=0,waitLost=false,backPending=false,wtok=0;
function resetWatch(){badN=0;goodN=0;lastAct=performance.now()/1000;lostSince=null;waiting=false;lastWait=-99;lastCue=-99;cueN=0;wstage=0;backPending=false;wtok++}
const COUNT5='오초셀거야~. 오, 사, 삼, 이, 일~!';
function wsay(key,text,nx){const tok=wtok;wstage=0;let d=0;const f=()=>{if(d||tok!==wtok)return;d=1;wt=performance.now()/1000;wstage=nx};$('coach').textContent=text;vsay(key,text,f);setTimeout(f,12000)}
function watch(t,present){if(!present){if(lostSince==null)lostSince=t}else lostSince=null;
 if(waiting){
  const back=present&&(waitLost||(ctr.live&&ctr.live.state!==waitSt));
  if(back){waiting=false;wstage=0;wtok++;backPending=true;lastAct=t;$('coach').textContent=AGAIN;playCheer('again',AGAIN);return}
  if(cheering)return;
  if(wstage===1&&t-wt>=4)wsay('wait2',WAIT2,2);
  else if(wstage===2&&t-wt>=4)wsay('count5',COUNT5,3);
  else if(wstage===3&&t-wt>=4)wsay('wait',WAIT,1);
  return}
 const lost=lostSince!=null&&t-lostSince>=LOST_SEC,idle=present&&t-lastAct>=IDLE_SEC;
 if((lost||idle)&&!cheering){waiting=true;waitLost=lost;waitSt=ctr.live?ctr.live.state:null;wtok++;wsay('wait',WAIT,1)}}
let badN=0,goodN=0;
function coachSched(issues){const depth=issues.find(x=>/앉|얕/.test(x));
 if(issues.length){goodN=0;const pos=badN%4;badN++;if(pos===3)return '';
  if(mode==='squat'&&depth)return ['조금 더 앉아볼까요','얕아요','조금만 더~!'][pos];return issues.join('. ')}
 badN=0;const pos=goodN%5;goodN++;return pos===0?'지금 잘했어!':pos===1?'좋아, 잘하고 있어!':''}
function liveCue(t){if(mode!=='squat'||cheering||waiting||!ctr.live)return;const L=ctr.live;let msg=null;
 if(L.state==='down'){if(L.view==='side'&&L.lean>50)msg='가슴을 세워요';else if(L.view==='front'&&L.kd<0.75)msg='무릎이 안으로 모여요. 발끝 방향으로!'}
 cueN=msg?cueN+1:0;if(msg&&cueN>=3&&t-lastCue>6){let busy=false;try{busy=speechSynthesis.speaking}catch(e){}if(busy)return;lastCue=t;cueN=0;$('coach').textContent=msg;speak(msg)}}
const GREET='안녕~ 또 만났네! 오늘도 운동을 시작해볼까?';
function intro(){phase='intro';setK=1;rtok++;$('coach').textContent=GREET;let done=false;const go=()=>{if(done)return;done=true;countdown()};vsay('greet',GREET,go);setTimeout(go,10000)}
function countdown(){let n=3;$('cd').hidden=false;const t=()=>{if(n>0){$('cd').textContent=n;n--;setTimeout(t,800)}else{$('cd').textContent='시작!';vsay('go','시작!');setTimeout(()=>{$('cd').hidden=true;newCtr();resetWatch();phase='play';$('coach').textContent=mode==='squat'?'서서 시작해 주세요.':'철봉·링에 매달려 시작해 주세요.';$('coach').textContent=mode==='squat'?'서서 시작해 주세요.':'철봉·링에 매달려 시작해 주세요.'},800)}};t()}
function newCtr(){ctr=new KINIT.Counter(mode);$('n').textContent=nTxt(0)}
function setMode(m){mode=m;$('m1').setAttribute('aria-pressed',m==='squat');$('m2').setAttribute('aria-pressed',m!=='squat');if(m!=='squat')mode='hang_tuck';newCtr();$('coach').textContent=m==='squat'?'서서 시작해 주세요.':'철봉·링에 매달려 시작해 주세요.'}
$('m1').onclick=()=>setMode('squat');$('m2').onclick=()=>setMode('hang_tuck');
$('rst').onclick=()=>{rtok++;setK=1;$('cd').hidden=true;newCtr();resetWatch();phase='play'};$('snd').onclick=e=>{sound=!sound;e.target.setAttribute('aria-pressed',sound)};
async function cam(){if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
 v.srcObject=stream;await v.play();await new Promise(r=>v.videoWidth?r():v.onloadedmetadata=r);
 c.width=v.videoWidth;c.height=v.videoHeight;if($('bg'))makeBg($('bg').value);$('box').style.aspectRatio=v.videoWidth+'/'+v.videoHeight;
 $('box').style.height='100%';$('box').classList.toggle('mir',facing==='user');newCtr()}
$('vtest').onclick=()=>{sound=true;$('snd').setAttribute('aria-pressed','true');probe().then(()=>vsay('n3',VOICE[$('vox').value].count(3)))};
$('vox').onchange=()=>{probe().then(()=>vsay('hello',VOICE[$('vox').value].hello))};$('dv').onchange=()=>speak(VOICE[$('vox').value].hello);
$('bg').onchange=()=>makeBg($('bg').value);
$('flip').onclick=async()=>{facing=facing==='user'?'environment':'user';try{await cam()}catch(e){$('coach').textContent='카메라 전환 실패: '+e.message}};
async function load(){ort.env.wasm.wasmPaths='./';ort.env.wasm.numThreads=self.crossOriginIsolated?Math.min(4,navigator.hardwareConcurrency||2):1;
 S=+$('res').value;w.width=w.height=S;wg=w.getContext('2d',{willReadFrequently:true});buf=new Float32Array(3*S*S);
 sess=await ort.InferenceSession.create('pose'+S+'.onnx',{executionProviders:['wasm'],graphOptimizationLevel:'all'})}
function beep(){if(!sound)return;try{actx=actx||new AudioContext();const o=actx.createOscillator(),gn=actx.createGain();o.frequency.value=880;gn.gain.value=.15;o.connect(gn);gn.connect(actx.destination);o.start();o.stop(actx.currentTime+.12)}catch(e){}}
const ONES=['','하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉'],TENS=['','열','스물','서른','마흔','쉰','예순','일흔','여든','아흔'];
function nat(n){if(n<1||n>99)return String(n);return TENS[Math.floor(n/10)]+ONES[n%10]}
function natCnt(n){if(n<1||n>99)return String(n);let t=nat(n);if(n===20)return '스무';return t.replace(/하나$/,'한').replace(/둘$/,'두').replace(/셋$/,'세').replace(/넷$/,'네')}
const CH={
 teacher:[n=>'우와, 벌써 '+natCnt(n)+' 개나 했어요! 정말 잘했어요!',n=>'대단해요! 벌써 '+natCnt(n)+' 개나 했어요! 정말 멋져요!',n=>'와, 벌써 '+natCnt(n)+' 개예요! 엄청나요! 진짜 대단해요!',n=>natCnt(n)+' 개라니! 믿을 수가 없어요! 최고예요!',n=>'와, '+natCnt(n)+' 개! 우리 친구는 운동 챔피언이에요!'],
 soldier:[n=>'좋았다! 벌써 '+natCnt(n)+' 개나 해냈다! 대단하다!',n=>'훌륭하다! 벌써 '+natCnt(n)+' 개를 해냈다! 정말 강하다!',n=>natCnt(n)+' 개! 엄청난 체력이다! 최고의 병사다!',n=>natCnt(n)+' 개! 믿을 수 없는 괴력이다! 대단하다!',n=>natCnt(n)+' 개! 너는 진정한 영웅이다!'],
 child:[n=>'우와, 벌써 '+natCnt(n)+' 개나 했어!',n=>'우와! 벌써 '+natCnt(n)+' 개나 했어! 진짜 대단해!',n=>natCnt(n)+' 개! 너무 멋져! 최고야!',n=>natCnt(n)+' 개라니! 믿을 수 없어! 짱이야!',n=>natCnt(n)+' 개! 넌 운동 챔피언이야!']};
CH.teacher.push(n=>natCnt(n)+' 개! 이제 진짜 슈퍼맨이에요! 멈추지 않는 모습이 정말 대단해요!',n=>natCnt(n)+' 개나! 선생님도 깜짝 놀랐어요! 말도 안 되게 대단해요!',n=>natCnt(n)+' 개! 전설이 되고 있어요! 세상에서 제일 멋져요!',n=>natCnt(n)+' 개! 우주 최강 슈퍼맨이에요! 정말 믿을 수 없어요!',n=>natCnt(n)+' 개! 새로운 신화를 쓰고 있어요! 영원히 기억할 거예요!');
CH.soldier.push(n=>natCnt(n)+' 개! 너는 이미 슈퍼맨이다! 멈추지 마라!',n=>natCnt(n)+' 개! 전군이 놀랐다! 믿을 수 없는 체력이다!',n=>natCnt(n)+' 개! 전설의 병사가 탄생하고 있다!',n=>natCnt(n)+' 개! 우주 최강이다! 경례!',n=>natCnt(n)+' 개! 신화를 쓰고 있다! 영원히 기억하겠다!');
CH.child.push(n=>natCnt(n)+' 개! 넌 진짜 슈퍼맨이야! 안 멈추네!',n=>natCnt(n)+' 개나! 깜짝 놀랐어! 말도 안 돼!',n=>natCnt(n)+' 개! 넌 전설이 되고 있어! 최고야!',n=>natCnt(n)+' 개! 우주 최강이야! 와아!',n=>natCnt(n)+' 개! 새로운 신화야! 영원히 기억할게!');
const cheerOf=(k,n)=>{const a=CH[k];return a[Math.min(Math.floor(n/10),a.length)-1](n)};
const VOICE={
 teacher:{pitch:1.15,rate:.92,count:n=>nat(n),cheer:n=>cheerOf('teacher',n),hello:'안녕! 선생님이랑 같이 운동해요!'},
 soldier:{pitch:.85,rate:1.08,count:n=>nat(n)+'!',cheer:n=>cheerOf('soldier',n),hello:'좋아! 지금부터 훈련을 시작한다!'},
 child:{pitch:1.45,rate:1.05,count:n=>nat(n),cheer:n=>cheerOf('child',n),hello:'안녕! 나랑 같이 운동하자!'}};
let cur=null;const AUD={};
async function probe(){const k=$('vox').value;if(AUD[k]!==undefined)return;AUD[k]=false;try{const r=await fetch('audio/'+k+'/greet.mp3',{method:'HEAD'});AUD[k]=r.ok}catch(e){}}
let cheering=false,pend=null,cheerTimer=0;
